name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify deploy artifact
        run: npm run verify:deploy
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY || vars.VITE_RECAPTCHA_SITE_KEY }}
          VTS_EDEN_VOTES_PIN: ${{ secrets.VTS_EDEN_VOTES_PIN }}
          VTS_EDEN_VOTES_PIN_HASH: ${{ secrets.VTS_EDEN_VOTES_PIN_HASH || vars.VTS_EDEN_VOTES_PIN_HASH }}
          VTS_ADMIN_OVERRIDE_CODE: ${{ secrets.VTS_ADMIN_OVERRIDE_CODE }}
          VTS_ADMIN_OVERRIDE_HASH: ${{ secrets.VTS_ADMIN_OVERRIDE_HASH || vars.VTS_ADMIN_OVERRIDE_HASH }}
      - run: cp CNAME dist/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_primary.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy_primary
        continue-on-error: true
      - name: Wait before retrying Pages deploy
        if: steps.deploy_primary.outcome == 'failure'
        run: sleep 20
      - uses: actions/deploy-pages@v5
        id: deploy_retry
        if: steps.deploy_primary.outcome == 'failure'
