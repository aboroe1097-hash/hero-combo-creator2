name: Visual baselines

# Playwright screenshot baselines must be generated on the same platform that
# checks them. CI runs `npm run check` (and therefore the visual regression
# tests) on ubuntu-latest, so a baseline captured on a developer's Windows or
# macOS machine differs by font antialiasing alone and fails here forever.
#
# Run this workflow from the Actions tab when a baseline legitimately needs to
# change — a deliberate header or layout change, or a new viewport. It never
# writes to the repository: it regenerates on Linux and uploads the result, and
# you commit the files after looking at them.
#
#   Actions -> Visual baselines -> Run workflow -> pick a branch
#   download the "visual-baselines" artifact
#   unzip it over tests/app-smoke.spec.js-snapshots/
#   review the diff, then commit
#
# Review the images before committing. Regeneration makes whatever the app
# currently renders into the new truth, so a real regression captured here
# becomes the baseline that hides it.

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only regenerate tests matching this title (blank = all visual regression tests)'
        required: false
        default: 'visual regression'

permissions:
  contents: read

jobs:
  regenerate:
    name: regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Regenerate snapshots
        # --update-snapshots rewrites baselines and, on a first capture, still
        # reports the test as failed. That is expected here, so the step is
        # allowed to fail and the artifact is what matters.
        continue-on-error: true
        run: >
          npx playwright test tests/app-smoke.spec.js
          -g "${{ inputs.grep }}"
          --update-snapshots
          --reporter=list
        env:
          VITE_FIREBASE_API_KEY: dummy
          VITE_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: dummy
          VITE_FIREBASE_STORAGE_BUCKET: dummy.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: 1:000000000000:web:dummy
          VITE_FIREBASE_MEASUREMENT_ID: G-DUMMY
          VITE_RECAPTCHA_SITE_KEY: dummy
          VTS_EDEN_VOTES_PIN: ci-only-not-a-secret
          VTS_ADMIN_OVERRIDE_CODE: ci-only-not-a-secret

      - name: Report what changed
        if: always()
        run: |
          echo "### Regenerated baselines" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git status --short tests/app-smoke.spec.js-snapshots/ >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/app-smoke.spec.js-snapshots/
          if-no-files-found: error
