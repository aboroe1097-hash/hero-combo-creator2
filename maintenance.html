<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#080d18" />
    <title>Maintenance Mode | VTS 1097 Toolkit</title>
    <link rel="icon" type="image/webp" href="images/logo-40.webp" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Sora, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080d18;
        color: #f6f8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 20%, rgba(132, 98, 255, 0.2), transparent 34rem),
          linear-gradient(145deg, #080d18, #11172a 54%, #080d18);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.26;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, black, transparent 90%);
      }

      main {
        position: relative;
        width: min(100%, 520px);
        padding: clamp(32px, 7vw, 52px);
        text-align: center;
        border: 1px solid rgba(187, 177, 255, 0.22);
        border-radius: 28px;
        background: rgba(14, 20, 37, 0.92);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
      }

      img {
        width: 92px;
        height: 92px;
        object-fit: contain;
        filter: drop-shadow(0 0 24px rgba(151, 120, 255, 0.42));
      }

      .kicker {
        margin: 22px 0 8px;
        color: #b8a9ff;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.17em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.25rem);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      .message {
        margin: 18px auto 0;
        max-width: 32ch;
        color: #cbd3e8;
        font-size: clamp(1rem, 3.7vw, 1.12rem);
        line-height: 1.65;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 26px;
        color: #f1edff;
        font-size: 0.84rem;
        font-weight: 700;
      }

      .status::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #a58dff;
        box-shadow: 0 0 0 6px rgba(165, 141, 255, 0.12);
        animation: pulse 1.8s ease-in-out infinite;
      }

      .version {
        margin: 28px 0 0;
        color: #7f8aa4;
        font: 600 0.72rem/1.4 "JetBrains Mono", ui-monospace, monospace;
      }

      @keyframes pulse {
        50% {
          opacity: 0.45;
          transform: scale(0.8);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="maintenanceTitle" aria-describedby="maintenanceMessage">
      <img src="images/logo-120.webp" alt="" width="92" height="92" />
      <p class="kicker">VTS 1097 TOOLKIT</p>
      <h1 id="maintenanceTitle">Maintenance Mode</h1>
      <p id="maintenanceMessage" class="message">
        We are making a few improvements. Please check back soon.
      </p>
      <p class="status" role="status">Work in progress</p>
      <p class="version">v14.0.3</p>
    </main>
  </body>
</html>
