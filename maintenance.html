<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#080d18" />
    <title>Maintenance Mode | VTS 1097 Toolkit</title>
    <link rel="icon" type="image/webp" href="images/logo-40.webp" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Sora,
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #080d18;
        color: #f6f8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 20%, rgba(132, 98, 255, 0.2), transparent 34rem),
          linear-gradient(145deg, #080d18, #11172a 54%, #080d18);
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.26;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, black, transparent 90%);
      }

      main {
        position: relative;
        width: min(100%, 520px);
        padding: clamp(32px, 7vw, 52px);
        text-align: center;
        border: 1px solid rgba(187, 177, 255, 0.22);
        border-radius: 28px;
        background: rgba(14, 20, 37, 0.92);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
      }

      img {
        width: 92px;
        height: 92px;
        object-fit: contain;
        filter: drop-shadow(0 0 24px rgba(151, 120, 255, 0.42));
      }

      .kicker {
        margin: 22px 0 8px;
        color: #b8a9ff;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.17em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.25rem);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      .message {
        margin: 18px auto 0;
        max-width: 32ch;
        color: #cbd3e8;
        font-size: clamp(1rem, 3.7vw, 1.12rem);
        line-height: 1.65;
      }

      .status-block {
        position: relative;
        width: min(100%, 17rem);
        margin: 22px auto 0;
        padding-top: 58px;
      }

      .velo-track {
        position: absolute;
        inset: 0 0 auto;
        height: 52px;
        border-bottom: 1px solid rgba(165, 141, 255, 0.22);
      }

      .velo {
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 54px;
        height: 54px;
        transform-origin: center bottom;
        animation: maintenance-velo-patrol 5.6s ease-in-out infinite;
      }

      .velo img {
        position: absolute;
        display: block;
        max-width: none;
        pointer-events: none;
      }

      .velo-body {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        animation: maintenance-velo-step 0.72s ease-in-out infinite;
      }

      .velo-helmet {
        top: -22%;
        left: 11%;
        width: 78%;
        height: auto;
        animation: maintenance-velo-helmet 0.72s ease-in-out infinite;
      }

      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        color: #f1edff;
        font-size: 0.84rem;
        font-weight: 700;
      }

      .version {
        margin: 28px 0 0;
        color: #7f8aa4;
        font:
          600 0.72rem/1.4 'JetBrains Mono',
          ui-monospace,
          monospace;
      }

      @keyframes maintenance-velo-patrol {
        0%,
        4% {
          left: 0;
          transform: scaleX(1);
        }
        44% {
          left: calc(100% - 54px);
          transform: scaleX(1);
        }
        50% {
          left: calc(100% - 54px);
          transform: scaleX(-1);
        }
        94% {
          left: 0;
          transform: scaleX(-1);
        }
        100% {
          left: 0;
          transform: scaleX(1);
        }
      }

      @keyframes maintenance-velo-step {
        50% {
          transform: translateY(-3px) rotate(-1.5deg);
        }
      }

      @keyframes maintenance-velo-helmet {
        50% {
          transform: translateY(-2px) rotate(2deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .velo {
          left: 50%;
          animation: none;
          transform: translateX(-50%);
        }

        .velo-body,
        .velo-helmet {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="maintenanceTitle" aria-describedby="maintenanceMessage">
      <img src="images/logo-120.webp" alt="" width="92" height="92" />
      <p class="kicker">VTS 1097 TOOLKIT</p>
      <h1 id="maintenanceTitle" data-vts-standalone-copy="title">Maintenance Mode</h1>
      <p id="maintenanceMessage" class="message" data-vts-standalone-copy="message">
        We are making a few improvements. Please check back soon.
      </p>
      <div class="status-block">
        <div class="velo-track" aria-hidden="true">
          <span class="velo">
            <img
              class="velo-body"
              src="assets/velo/velo-body-160.webp"
              alt=""
              width="54"
              height="54"
            />
            <img
              class="velo-helmet"
              src="assets/velo/velo-helmet-160.webp"
              alt=""
              width="42"
              height="42"
            />
          </span>
        </div>
        <p class="status" role="status" data-vts-standalone-copy="status">Work in progress</p>
      </div>
      <p class="version">v14.0.16</p>
    </main>
    <script src="js/i18n/standalone-copy.js" data-vts-standalone-page="maintenance"></script>
  </body>
</html>
